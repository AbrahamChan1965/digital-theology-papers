name: Auto-Index Papers & Trigger Cloudflare Edge Deploy

on:
  push:
    branches: [ main ]
    paths:
      - 'papers/**'
      - 'scripts/build_index.py'

permissions:
  contents: write

jobs:
  rebuild-index:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Rebuild papers.json and llms.txt
        run: python3 scripts/build_index.py

      - name: Commit updated index if changed
        run: |
          if [ -n "$(git status --porcelain papers.json llms.txt)" ]; then
            git config user.name "wns-publishing-bot"
            git config user.email "actions@wordandspirit.com"
            git add papers.json llms.txt
            git commit -m "Auto-update papers.json and llms.txt [skip ci]"
            git push
          else
            echo "Index already up to date."
          fi
