<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Digital Theological Paper Collection · Word & Spirit</title>
  <style>
    :root {
      --purple: #551A8B;
      --gold: #D4AF37;
      --bg: #FAFAFA;
      --card: #FFFFFF;
      --ink: #1A1A1F;
      --muted: #5A5A66;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: "Noto Serif TC", Georgia, serif;
      background: var(--bg);
      color: var(--ink);
      line-height: 1.75;
    }
    header {
      border-bottom: 3px solid var(--gold);
      background: var(--purple);
      color: #fff;
      padding: 3.5rem 1.5rem 2.75rem;
    }
    .wrap { max-width: 920px; margin: 0 auto; }
    .eyebrow {
      font-family: system-ui, sans-serif;
      font-size: 0.78rem;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: var(--gold);
      margin-bottom: 0.6rem;
    }
    h1 { font-size: 2.1rem; font-weight: 700; line-height: 1.3; }
    .sub { margin-top: 0.75rem; color: rgba(255,255,255,0.86); font-size: 1rem; }
    .lang-bar {
      display: flex;
      justify-content: flex-end;
      gap: 0.5rem;
      margin: 1.5rem auto 0;
      padding: 0 1.5rem;
      max-width: 920px;
    }
    .lang-btn {
      border: 1px solid var(--purple);
      background: #fff;
      color: var(--purple);
      padding: 0.35rem 0.9rem;
      border-radius: 4px;
      cursor: pointer;
      font-weight: 600;
    }
    .lang-btn.active { background: var(--purple); color: #fff; }
    main { max-width: 920px; margin: 2rem auto 5rem; padding: 0 1.5rem; }
    .paper-card {
      background: var(--card);
      border: 1px solid #E5E5EA;
      border-left: 4px solid var(--purple);
      padding: 2rem;
      border-radius: 6px;
      margin-bottom: 1.5rem;
    }
    .meta {
      font-family: system-ui, sans-serif;
      font-size: 0.82rem;
      color: var(--muted);
      margin-bottom: 0.5rem;
    }
    .paper-card h2 { font-size: 1.35rem; color: var(--purple); margin-bottom: 0.75rem; }
    .links { display: flex; gap: 1rem; margin-top: 1.25rem; font-family: system-ui, sans-serif; font-size: 0.9rem; }
    .links a {
      text-decoration: none;
      color: var(--purple);
      border: 1px solid var(--purple);
      padding: 0.4rem 0.9rem;
      border-radius: 4px;
      font-weight: 600;
    }
    .links a:hover { background: var(--purple); color: #fff; }
  </style>
</head>
<body>
  <header>
    <div class="wrap">
      <div class="eyebrow">Word &amp; Spirit · papers.wordandspirit.com</div>
      <h1 id="site-title">Digital Theological Paper Collection</h1>
      <p class="sub" id="site-sub">Bilingual Research in Digital Theology, Liturgical Time, and Pastoral Ministry</p>
    </div>
  </header>
  <div class="lang-bar">
    <button class="lang-btn active" onclick="setLang('en', this)">English</button>
    <button class="lang-btn" onclick="setLang('zh', this)">繁體中文</button>
  </div>
  <main id="paper-list"></main>
  <script>
    let currentLang = 'en';
    let papersData = [];
    function setLang(lang, btn) {
      currentLang = lang;
      document.querySelectorAll('.lang-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      document.getElementById('site-title').textContent =
        lang === 'zh' ? '聖言靈禱 · 數字神學思考論文集' : 'Digital Theological Paper Collection';
      document.getElementById('site-sub').textContent =
        lang === 'zh' ? '當代數字神學、禮儀時間與教會論牧養行動研究' : 'Bilingual Research in Digital Theology, Liturgical Time, and Pastoral Ministry';
      render();
    }
    function render() {
      const container = document.getElementById('paper-list');
      container.innerHTML = papersData.map(p => `
        <article class="paper-card">
          <div class="meta">${p.date} · ${p.liturgical_context}</div>
          <h2>${currentLang === 'zh' ? p.title_zh : p.title_en}</h2>
          <div class="links">
            <a href="${p.en_path}">Read English (.md)</a>
            <a href="${p.zh_path}">閱讀中文 (.md)</a>
          </div>
        </article>
      `).join('');
    }
    fetch('papers.json').then(r => r.json()).then(d => { papersData = d.papers; render(); });
  </script>
</body>
</html>
